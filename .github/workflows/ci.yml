name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# PR에 새 커밋을 밀면 진행 중이던 이전 실행을 취소한다 (러너 시간 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet 캐시
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 복원
        run: dotnet restore backend/MyHome.slnx

      - name: 빌드
        run: dotnet build backend/MyHome.slnx -c Release --no-restore

      - name: 테스트 (xUnit)
        run: >
          dotnet test backend/MyHome.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"

      # 실패했을 때 어떤 테스트가 깨졌는지 PR에서 바로 받아볼 수 있게 한다
      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 테스트 (Vitest)
        run: npm run test

      # build 스크립트가 `tsc -b && vite build` 라서 타입 검사도 함께 이뤄진다
      - name: 타입체크 + 빌드
        run: npm run build

  # ---------------------------------------------------------------------
  # 배포: master에 푸시되고 위 두 잡이 모두 통과했을 때만 동작한다.
  # 별도 워크플로로 분리하지 않은 이유는 `needs:`가 같은 워크플로 안에서만
  # 통하기 때문이다 — 테스트가 배포를 확실히 게이트하도록 한 파일에 둔다.
  # ---------------------------------------------------------------------
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Graviton(t4g) 인스턴스와 아키텍처를 맞춘다. arm64 러너는 public 리포에서
    # 무료라 QEMU 에뮬레이션 없이 네이티브로 빌드된다.
    runs-on: ubuntu-24.04-arm

    # 동시에 두 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다
    # (중간에 끊으면 서버 상태가 어정쩡해진다).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      id-token: write   # OIDC 토큰 발급 — AWS 장기 액세스 키를 쓰지 않기 위함
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: myhome

    steps:
      - uses: actions/checkout@v4

      # 액세스 키 대신 OIDC로 IAM 역할을 잠시 빌린다.
      # GitHub Secrets에 저장되는 건 역할 ARN뿐이라 유출돼도 그 자체로는 무용지물.
      # 역할의 신뢰 정책이 sub 클레임으로 리포·브랜치를 제한한다.
      # GitHub은 2026-07-15 이후 생성된 리포부터 sub에 불변 ID를 넣는다:
      #   repo:<owner>@<ownerId>/<repo>@<repoId>:ref:refs/heads/master
      # 이름 기반 형식으로 정책을 쓰면 조건 불일치로 인증에 실패한다.
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & ECR 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # latest는 배포용, SHA 태그는 롤백용으로 함께 남긴다.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # npm ci / dotnet restore 레이어를 러너 간에 재사용해 빌드를 줄인다
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH 대신 SSM으로 명령을 보낸다. 덕분에 22번 포트를 GitHub IP 대역
      # (사실상 전 세계)에 열 필요가 없고, GitHub에 SSH 키를 두지 않아도 된다.
      - name: SSM으로 배포 실행
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "MyHome deploy ${GITHUB_SHA::7}" \
            --parameters "commands=['/usr/local/bin/myhome-deploy ${GITHUB_SHA}']" \
            --query Command.CommandId --output text)

          echo "SSM command: $command_id"

          # 실패해도 여기서 죽지 않게 한다 — 아래에서 서버 로그를 찍어야 하므로.
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" || true

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "--- 서버 출력 ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$status" != "Success" ]; then
            echo "--- 서버 에러 출력 ---"
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            echo "❌ 배포 실패: $status"
            exit 1
          fi

          echo "✅ 배포 성공"
