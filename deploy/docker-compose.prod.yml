services:
  myhome:
    # 이미지는 ECR에서 받는다. ECR_REGISTRY는 /srv/myhome/.env에 있고,
    # IMAGE_TAG는 myhome-deploy가 셸 환경변수로 덮어쓴다 (기본 latest).
    image: ${ECR_REGISTRY}/myhome:${IMAGE_TAG:-latest}
    container_name: myhome
    restart: unless-stopped
    # 외부 노출 금지 — caddy만 접근한다
    expose:
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/myhome.db
      - TZ=America/New_York
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Jwt__Key=${JWT_KEY}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
    volumes:
      - /srv/myhome/data:/data
      - /srv/myhome/data/wwwroot/uploads:/app/wwwroot/uploads
      - /srv/myhome/data/wwwroot/photos:/app/wwwroot/photos

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/myhome/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      # 인증서 발급을 반복 실험할 때만 .env에 ACME_CA=<스테이징 주소>를 넣는다.
      # 기본값을 여기서 프로덕션 주소로 채워야 한다 — ${ACME_CA:-} 처럼 비워두면
      # 컨테이너에 "정의됐지만 빈 값"으로 전달되고, Caddyfile의 {$ACME_CA:기본값}
      # 은 미정의일 때만 기본값을 쓰므로 acme_ca 가 인자 없이 남아 기동에 실패한다.
      - ACME_CA=${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    depends_on:
      - myhome

volumes:
  caddy_data:
  caddy_config:
